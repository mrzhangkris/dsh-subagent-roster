# dsh-subagent-roster bundle patch: mounts the subagent-roster plugin into the
# host composition of a dsh profile. The plugin registers its roster tools
# (roster_list / roster_agent) into the shared `tools` registry and its usage
# and roster-directory sections into the global system prompt, so every
# session of the profile can dispatch named roster roles through natural
# language.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: subagent-roster
      # Node-resolvable package name — must stay in sync with package.json
      # `name`. Quoted because `@` is a reserved indicator in YAML and cannot
      # open a plain scalar.
      name: '@mrzhangkris/dsh-subagent-roster'
